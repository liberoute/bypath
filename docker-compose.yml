services:
  bypath:
    build:
      context: .
      args:
        VARIANT: lite
        VERSION: "3.0.0"
    container_name: bypath
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      - ./engines:/app/engines
      - ./logs:/app/logs
      # The proxy guard record must be the same for every process that manages
      # this host firewall; without it a second host-network container cannot
      # prove whose BYPATH_PROXY_IN chain it sees.
      - /var/lib/bypath:/var/lib/bypath
    environment:
      - TZ=UTC
    sysctls:
      - net.ipv4.ip_forward=1
