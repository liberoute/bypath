name: Build & Release

on:
  push:
    # release/** runs validation only: the release-assets job stages the
    # installer assets as a workflow artifact, and publication stays manual.
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  BINARY_NAME: bypath

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"

      - name: Go vet
        run: go vet ./...

  embed:
    name: Embedded payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"

      - name: Stage pinned tun2socks assets
        run: make stage-tun2socks-amd64 stage-tun2socks-arm64 stage-tun2socks-armv7

      # A missing asset must fail, not skip: BYPATH_REQUIRE_ASSETS turns the
      # staged-asset tests into hard failures. internal/tunnel carries the
      # real-engine validation tests, which only exist under the full tag.
      - name: Embed-tag tests
        env:
          BYPATH_REQUIRE_ASSETS: '1'
        run: go test -tags "full with_utls embed_tun2socks" ./internal/embedbin/ ./internal/build/ ./internal/engine/ ./internal/tunnel/ -count=1

      # ARM test binaries cannot run on the x86 runner; compiling them is what
      # proves each architecture selects its own embedded asset.
      - name: Cross-compile embed tests for ARM
        run: |
          GOOS=linux GOARCH=arm64 go test -c -tags "full with_utls embed_tun2socks" -o /dev/null ./internal/embedbin/
          GOOS=linux GOARCH=arm GOARM=7 go test -c -tags "full with_utls embed_tun2socks" -o /dev/null ./internal/embedbin/

      # Any target without a staged asset must be rejected at compile time.
      - name: Unsupported target must not compile
        run: |
          if GOOS=linux GOARCH=386 go build -tags "full with_utls embed_tun2socks" -o /dev/null ./cmd/bypath; then
            echo "embed build unexpectedly succeeded on linux/386"
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: [test, lint, embed]
    strategy:
      matrix:
        include:
          # Lite builds
          - { os: linux, arch: amd64, variant: lite, tags: '' }
          - { os: linux, arch: arm64, variant: lite, tags: '' }
          - { os: linux, arch: arm, variant: lite, tags: '', goarm: '7' }
          - { os: linux, arch: mipsle, variant: lite, tags: '', gomips: 'softfloat' }
          - { os: windows, arch: amd64, variant: lite, tags: '' }
          - { os: darwin, arch: amd64, variant: lite, tags: '' }
          - { os: darwin, arch: arm64, variant: lite, tags: '' }
          # Full builds
          - { os: linux, arch: amd64, variant: full, tags: 'full with_utls' }
          - { os: linux, arch: arm64, variant: full, tags: 'full with_utls' }
          - { os: linux, arch: arm, variant: full, tags: 'full with_utls', goarm: '7' }
          - { os: windows, arch: amd64, variant: full, tags: 'full with_utls' }
          - { os: darwin, arch: amd64, variant: full, tags: 'full with_utls' }
          - { os: darwin, arch: arm64, variant: full, tags: 'full with_utls' }

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=3.0.0-dev.$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: '0'
        run: |
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi

          FILENAME="${{ env.BINARY_NAME }}-${{ matrix.variant }}-${{ matrix.os }}-${{ matrix.arch }}${EXT}"

          LDFLAGS="-s -w"
          LDFLAGS="$LDFLAGS -X github.com/liberoute/bypath/internal/build.Version=${{ steps.version.outputs.version }}"
          LDFLAGS="$LDFLAGS -X github.com/liberoute/bypath/internal/build.Commit=${{ github.sha }}"
          # BuildDate is the source commit time, so the same commit always
          # yields the same binary (reproducible release builds).
          BUILD_DATE="$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="$LDFLAGS -X github.com/liberoute/bypath/internal/build.BuildDate=${BUILD_DATE}"

          # The tag set can contain several space-separated tags; an unquoted
          # string would hand go one argument per word and treat the rest as
          # packages. Build the argument list instead.
          TAGS=()
          if [ -n "${{ matrix.tags }}" ]; then TAGS=(-tags "${{ matrix.tags }}"); fi

          # -trimpath keeps workspace and module-cache paths out of the binary;
          # -buildvcs=false keeps the checkout path out of the VCS stamp.
          go build -trimpath -buildvcs=false "${TAGS[@]}" -ldflags "$LDFLAGS" -o "dist/${FILENAME}" ./cmd/bypath

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.variant }}-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

  integration:
    name: Integration Test (Docker)
    runs-on: ubuntu-latest
    needs: [test, lint, embed]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build test image
        run: docker build -f test/integration/Dockerfile.test -t bypath-test .

      - name: Run integration tests
        run: docker run --rm bypath-test

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, integration]
    # Version tags are published as GitHub Pre-releases by the explicit,
    # manually verified release process; a tag push must not create a
    # non-prerelease release. Only main pushes create the rolling dev build.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set release tag
        id: tag
        run: |
          echo "tag=dev" >> $GITHUB_OUTPUT
          echo "name=Dev Build (latest)" >> $GITHUB_OUTPUT
          echo "prerelease=true" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Delete existing dev release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete "${{ steps.tag.outputs.tag }}" --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}

  # Stages the exact assets the installer downloads (bypath-<variant>-linux-<arch>
  # plus SHA256SUMS). It runs for version tags and release branches only, and it
  # only uploads a workflow artifact: publishing a release stays a manual step.
  release-assets:
    name: Stage release assets (no publication)
    runs-on: ubuntu-latest
    needs: [build, integration]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create SHA256SUMS for the installer assets
        run: |
          cd dist
          # Only the files the installer can request are checksummed; every
          # bypath-* binary of the matrix is listed so nothing is unverified.
          ls bypath-* > /dev/null
          sha256sum bypath-* > SHA256SUMS
          cp ../install.sh install.sh
          sha256sum install.sh >> SHA256SUMS
          cp ../THIRD_PARTY_NOTICES.md THIRD_PARTY_NOTICES.md
          sha256sum THIRD_PARTY_NOTICES.md >> SHA256SUMS

      - name: Upload staged release assets (not published)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
